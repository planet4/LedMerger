<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LED Preview — Pixbo Rink</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050505; color:#ccc; font-family:'Outfit',sans-serif; overflow:hidden; height:100vh; }
#topbar {
  position:fixed; top:0; left:0; right:0; height:52px;
  background:rgba(0,0,0,0.97); border-bottom:1px solid #111;
  display:flex; align-items:center; padding:0 20px; gap:20px; z-index:100;
}
#topbar .logo { color:#CC1020; font-weight:700; letter-spacing:2px; font-size:13px; }
.modes { display:flex; gap:10px; }
.mode-btn {
  background:#1E1E26; border:1px solid #2E2E3A; color:#888;
  padding:9px 22px; border-radius:12px; font-size:12px; font-weight:600;
  text-transform:uppercase; letter-spacing:0.04em; cursor:pointer; font-family:inherit; transition:all .15s;
}
.mode-btn:hover:not(.disabled) { border-color:#CC1020; color:#fff; }
.mode-btn.active { background:#CC1020; border-color:#CC1020; color:#fff; }
.mode-btn.disabled { opacity:.3; cursor:not-allowed; pointer-events:none; }
#optbar {
  position:fixed; top:52px; left:0; right:0; height:38px;
  background:rgba(0,0,0,0.97); border-bottom:1px solid #111;
  display:flex; align-items:center; padding:0 20px; gap:8px; z-index:100;
}
.opt-label { color:#555; font-size:10px; font-weight:600; letter-spacing:0.08em; margin-right:6px; text-transform:uppercase; }
.opt-btn {
  background:#1E1E26; border:1px solid #2E2E3A; color:#888;
  padding:6px 13px; border-radius:8px; font-size:11px; font-weight:500;
  cursor:pointer; font-family:inherit; letter-spacing:0.02em; transition:all .15s;
}
.opt-btn:hover:not(.disabled) { border-color:#CC1020; color:#fff; }
.opt-btn.on { border-color:#CC1020; color:#CC1020; background:rgba(204,16,32,0.1); }
.opt-btn.disabled { opacity:.3; cursor:not-allowed; pointer-events:none; }
#stage {
  position:fixed; top:110px; left:20px;
  display:flex; flex-direction:column; gap:20px;
  transform-origin:top left;
}
.row-wrap { display:flex; flex-direction:column; gap:4px; }
.row-label { font-size:9px; font-weight:500; color:#3a3a3a; letter-spacing:0.05em; text-transform:uppercase; padding-left:2px; }
.row { display:flex; gap:8px; align-items:flex-start; }
.unit { display:flex; flex-direction:column; gap:3px; }
.panel {
  background:#000; border-radius:3px; position:relative; overflow:hidden;
  box-shadow: 0 0 0 2px #111, 0 6px 30px rgba(0,0,0,0.95);
}
/* The main canvas uses CSS pixel-art scaling for crisp pixels */
.panel canvas.main-cv {
  display:block;
  image-rendering:pixelated;
}
/* Glow layer */
.glow-cv {
  position:absolute; inset:0; pointer-events:none;
  mix-blend-mode:screen; opacity:0; transition:opacity .3s;
  image-rendering:pixelated;
  filter:blur(4px) brightness(1.4);
}
.glow-cv.on { opacity:0.6; }
/* Grid overlay */
.grid-cv {
  position:absolute; inset:0; pointer-events:none;
  opacity:0; transition:opacity .2s;
}
.grid-cv.on { opacity:1; }
#videos { display:none; }
#loading {
  position:fixed; inset:0; background:#000;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:10px; z-index:200; transition:opacity .5s;
}
#loading.fade { opacity:0; pointer-events:none; }
.spinner { width:20px; height:20px; border:2px solid #111; border-top-color:#CC1020; border-radius:50%; animation:spin .7s linear infinite; }
#loading p { font-size:10px; color:#333; letter-spacing:3px; }
@keyframes spin { to{transform:rotate(360deg)} }
#corner { position:fixed; bottom:10px; right:12px; font-size:8px; color:#111; letter-spacing:1px; line-height:1.9; text-align:right; text-transform:uppercase; }
</style>
</head>
<body>
<div id="topbar">
  <span class="logo">PIXBO LED</span>
  <div class="modes">
    <button id="modeArena" class="mode-btn active" onclick="setMode('arena')">ARENA VIEW</button>
    <button id="modeMerged" class="mode-btn" onclick="setMode('merged')" title="Play the final merged file directly">MERGED FILE</button>
    <button id="modeSeparate" class="mode-btn" onclick="setMode('separate')">SEPARATE FILES</button>
  </div>
</div>
<div id="optbar">
  <span class="opt-label">OPTIONS</span>
  <button id="bGrid" class="opt-btn" onclick="toggleGrid()" title="Pixel grid overlay (Separate Files only)">GRID</button>
  <button id="bGlow" class="opt-btn" onclick="toggleGlow()" title="LED glow effect (Separate Files only)">GLOW</button>
  <button id="bSync" class="opt-btn" onclick="syncAll()" title="Reset clips to t=0 — they loop independently and can drift out of sync">SYNC</button>
  <button id="bSpeed" class="opt-btn" onclick="cycleSpeed()" title="Playback speed">1×</button>
  <button id="bZoomOut" class="opt-btn" onclick="zoom(-0.15)" title="Zoom out (Separate Files only)">− ZOOM</button>
  <button id="bZoomIn" class="opt-btn" onclick="zoom(0.15)" title="Zoom in (Separate Files only)">+ ZOOM</button>
  <button class="opt-btn" onclick="toggleFullscreen()" title="Fullscreen">FULLSCREEN</button>
</div>

<div id="videos"></div>
<div id="stage"></div>
<div id="loading"><div class="spinner"></div><p>LOADING DISPLAYS</p></div>
<div id="corner">Pixbo Wallenstam<br>LED Rink Simulator</div>

<!-- Arena View overlay -->
<div id="arenaView" style="display:none;position:fixed;inset:0;top:90px;background:#050505;z-index:50;overflow:hidden;">
  <canvas id="arenaCanvas" style="position:absolute;inset:0;width:100%;height:100%;"></canvas>
</div>

<!-- Merged file overlay — plays the single final stacked export directly -->
<div id="mergedView" style="display:none;position:fixed;inset:0;top:90px;background:#050505;z-index:50;align-items:center;justify-content:center;">
  <video id="mergedVideo" controls autoplay loop muted playsinline
    style="max-width:92vw;max-height:88vh;border-radius:3px;box-shadow:0 0 0 2px #111,0 6px 30px rgba(0,0,0,0.95);"></video>
</div>

<script>
const QP = new URLSearchParams(location.search);
const DISPLAYS = [0,1,2,3,4].map(id => ({
  id,
  path:   QP.get('d'+id)||'',
  width:  parseInt(QP.get('w'+id))||576,
  height: 64,
  name:   QP.get('n'+id)||('Display '+id),
})).filter(d=>d.path);
const MERGED_PATH = QP.get('merged') || '';

const ROWS = [
  {label:'ROW 1', ids:[0,1]},
  {label:'ROW 2', ids:[2,3]},
  {label:'ROW 3', ids:[4]},
];

// Pixel display scale — CSS zoom makes pixels visible without slow JS loop
const ZOOM_PX = 5; // each LED pixel = 5x5 CSS pixels

let scale=1, glow=false, grid=false;
let mode='arena'; // 'arena' | 'merged' | 'separate'
const SPEEDS=[1,1.5,2,3,4,0.5];
let speedIdx=0;

const vids={}, mainCv={}, glowCv={}, gridCv={}, srcCv={};

function disp(id){return DISPLAYS.find(d=>d.id===id);}

function computeScale(){
  const maxW=Math.max(...ROWS.map(r=>r.ids.reduce((s,id)=>{const d=disp(id);return s+(d?d.width:0);},0)));
  const activeRows=ROWS.filter(r=>r.ids.some(id=>disp(id))).length;
  const natW=maxW*ZOOM_PX, natH=activeRows*64*ZOOM_PX+activeRows*20+40;
  return Math.min((window.innerWidth-60)/natW,(window.innerHeight-140)/natH,1.5);
}

const IMAGE_EXTS=['png','jpg','jpeg','gif','webp'];
function isImage(p){return IMAGE_EXTS.includes(p.split('.').pop().toLowerCase());}

// Draw LED grid once onto a canvas
function drawGridOnce(cv, W, H){
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='rgba(0,0,0,0.5)';
  for(let x=ZOOM_PX;x<cv.width;x+=ZOOM_PX){
    ctx.fillRect(x,0,1,cv.height);
  }
  for(let y=ZOOM_PX;y<cv.height;y+=ZOOM_PX){
    ctx.fillRect(0,y,cv.width,1);
  }
}

function buildVideos(){
  const c=document.getElementById('videos');
  DISPLAYS.forEach(d=>{
    const url='/api/stream?path='+encodeURIComponent(d.path);
    let el;
    if(isImage(d.path)){
      el=document.createElement('img');
      el.src=url; el.crossOrigin='anonymous';
      el.style.display='none'; el._isImage=true;
    } else {
      el=document.createElement('video');
      el.src=url; el.muted=true; el.loop=true;
      el.playsInline=true; el.crossOrigin='anonymous';
      el.preload='auto'; el._isImage=false;
    }
    c.appendChild(el);
    vids[d.id]=el;
    // Source canvas at native resolution
    const sc=document.createElement('canvas');
    sc.width=d.width; sc.height=d.height;
    srcCv[d.id]=sc;
  });
  if(MERGED_PATH){
    document.getElementById('mergedVideo').src='/api/stream?path='+encodeURIComponent(MERGED_PATH);
  } else {
    const b=document.getElementById('modeMerged');
    b.classList.add('disabled');
    b.title='No merged file available for this preview';
  }
  if(!DISPLAYS.length){
    // Nothing to split into per-display feeds (e.g. a raw single-display
    // clip, not a stacked export) — only Merged File applies.
    ['modeArena','modeSeparate'].forEach(id=>{
      const b=document.getElementById(id);
      b.classList.add('disabled');
      b.title='No per-display clips for this file — it isn\'t a stacked export';
    });
  }
}

function buildStage(){
  scale=computeScale();
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  stage.style.transform='scale('+scale+')';

  ROWS.forEach(row=>{
    const rowDisps=row.ids.map(id=>disp(id)).filter(Boolean);
    if(!rowDisps.length) return;

    const wrap=document.createElement('div'); wrap.className='row-wrap';
    const lbl=document.createElement('div'); lbl.className='row-label';
    lbl.textContent=rowDisps.map(d=>d.name+' '+d.width+'px').join(' + ');
    wrap.appendChild(lbl);
    const rowDiv=document.createElement('div'); rowDiv.className='row';

    rowDisps.forEach(d=>{
      // Panel dimensions in screen pixels
      const pw=d.width*ZOOM_PX, ph=d.height*ZOOM_PX;

      const unit=document.createElement('div'); unit.className='unit';
      const panel=document.createElement('div'); panel.className='panel';
      panel.style.width=pw+'px'; panel.style.height=ph+'px';

      // Main canvas — drawn at native size, scaled up via CSS
      const cv=document.createElement('canvas');
      cv.className='main-cv';
      cv.width=d.width; cv.height=d.height;
      cv.style.width=pw+'px'; cv.style.height=ph+'px';
      mainCv[d.id]=cv; panel.appendChild(cv);

      // Glow canvas — same native size, CSS blur does the work
      const gc=document.createElement('canvas');
      gc.className='glow-cv'+(glow?' on':'');
      gc.width=d.width; gc.height=d.height;
      gc.style.width=pw+'px'; gc.style.height=ph+'px';
      glowCv[d.id]=gc; panel.appendChild(gc);

      // Grid canvas — drawn once at screen size
      const grc=document.createElement('canvas');
      grc.className='grid-cv'+(grid?' on':'');
      grc.width=pw; grc.height=ph;
      drawGridOnce(grc, d.width, d.height);
      gridCv[d.id]=grc; panel.appendChild(grc);

      unit.appendChild(panel);
      rowDiv.appendChild(unit);
    });

    wrap.appendChild(rowDiv);
    stage.appendChild(wrap);
  });
}

function renderPanel(id){
  const v=vids[id], sc=srcCv[id], mc=mainCv[id], gc=glowCv[id], d=disp(id);
  if(!v||!sc||!mc||!d) return;
  if(v._isImage){if(!v.complete||!v.naturalWidth) return;}
  else{if(v.readyState<2) return;}

  const W=d.width, H=d.height;

  // Draw to source canvas at native res
  const sCtx=sc.getContext('2d',{willReadFrequently:true});
  sCtx.drawImage(v,0,0,W,H);

  // Draw to main canvas (native size — CSS zooms it up with pixelated rendering)
  const mCtx=mc.getContext('2d');
  mCtx.drawImage(sc,0,0);

  // Glow — just copy the same frame, CSS filter does blur+brightness
  if(glow){
    const gCtx=gc.getContext('2d');
    gCtx.drawImage(sc,0,0);
  }
}

function loop(){
  requestAnimationFrame(loop);
  DISPLAYS.forEach(d=>renderPanel(d.id));
}

function toggleGlow(){
  if(mode!=='separate') return;
  glow=!glow;
  document.getElementById('bGlow').classList.toggle('on',glow);
  Object.values(glowCv).forEach(gc=>gc.classList.toggle('on',glow));
}
function toggleGrid(){
  if(mode!=='separate') return;
  grid=!grid;
  document.getElementById('bGrid').classList.toggle('on',grid);
  Object.values(gridCv).forEach(gc=>gc.classList.toggle('on',grid));
}
function syncAll(){
  if(mode==='merged') return;
  Object.values(vids).forEach(v=>{try{v.currentTime=0;}catch(e){}});
  setTimeout(()=>Object.values(vids).forEach(v=>{if(!v._isImage)v.play().catch(()=>{}); }),60);
}
function cycleSpeed(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  const r=SPEEDS[speedIdx];
  Object.values(vids).forEach(v=>{if(!v._isImage)v.playbackRate=r;});
  const mv=document.getElementById('mergedVideo');
  if(mv) mv.playbackRate=r;
  document.getElementById('bSpeed').textContent=r+'×';
}
function zoom(delta){
  if(mode!=='separate') return;
  scale=Math.max(0.1,Math.min(3,scale+delta));
  document.getElementById('stage').style.transform='scale('+scale+')';
}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
}
window.addEventListener('resize',()=>{scale=computeScale();zoom(0);});
document.addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='=') zoom(0.15);
  if(e.key==='-') zoom(-0.15);
  if(e.key==='g'||e.key==='G') toggleGlow();
  if(e.key==='r'||e.key==='R') toggleGrid();
  if(e.key==='s'||e.key==='S') syncAll();
  if(e.key==='f'||e.key==='F') toggleFullscreen();
});

// ── VIEW MODES ───────────────────────────────────────────────────────────────
function updateOptAvailability(){
  const sepOnly = mode==='separate';
  ['bGrid','bGlow','bZoomIn','bZoomOut'].forEach(id=>{
    document.getElementById(id).classList.toggle('disabled', !sepOnly);
  });
  document.getElementById('bSync').classList.toggle('disabled', mode==='merged');
}

function setMode(m){
  if(m==='merged' && !MERGED_PATH) return; // guarded — button is disabled too
  mode=m;
  document.getElementById('modeArena').classList.toggle('active', m==='arena');
  document.getElementById('modeMerged').classList.toggle('active', m==='merged');
  document.getElementById('modeSeparate').classList.toggle('active', m==='separate');
  document.getElementById('arenaView').style.display = m==='arena' ? 'block' : 'none';
  document.getElementById('mergedView').style.display = m==='merged' ? 'flex' : 'none';
  document.getElementById('stage').style.display = m==='separate' ? 'flex' : 'none';
  if(m==='arena') ensureArenaImage();
  updateOptAvailability();
}

// ── ARENA VIEW ──────────────────────────────────────────────────────────────
let arenaImg = null;

// Arena zones: 4 corners [TL, TR, BR, BL] as fractions of 1920×1080
// Tune these coordinates if strips need repositioning
const ARENA_ZONES = [
  // pts: [TL, TR, BR, BL] as fractions of 1920×1080
  // Measured from the painted strip colors in layout.png — keep in sync if the photo is repainted
  { id:0, label:'Shortside',       w:1344, pts:[[0.00260,0.53148],[0.28646,0.49167],[0.28646,0.50926],[0.00260,0.55741]] },
  { id:1, label:'L-Left',          w:576,  pts:[[0.33229,0.48889],[0.39635,0.50000],[0.39635,0.51667],[0.33229,0.50463]] },
  { id:2, label:'Longside Center', w:1728, pts:[[0.42396,0.50556],[0.73698,0.55833],[0.73698,0.58426],[0.42396,0.52222]] },
  { id:3, label:'L-Right',         w:576,  pts:[[0.80469,0.57222],[0.99635,0.60370],[0.99635,0.63796],[0.80469,0.59815]] },
  { id:4, label:'Media',           w:192,  pts:[[0.04531,0.83241],[0.15260,0.83704],[0.15260,0.88981],[0.04531,0.88796]] },
];

function drawArenaView() {
  const cv = document.getElementById('arenaCanvas');
  const W = cv.offsetWidth, H = cv.offsetHeight;
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  if (arenaImg && arenaImg.complete) {
    // Fit image to canvas
    const imgAr = arenaImg.naturalWidth / arenaImg.naturalHeight;
    const canAr = W / H;
    let dw, dh, dx, dy;
    if (imgAr > canAr) { dw=W; dh=W/imgAr; dx=0; dy=(H-dh)/2; }
    else { dh=H; dw=H*imgAr; dy=0; dx=(W-dw)/2; }
    ctx.drawImage(arenaImg, dx, dy, dw, dh);

    ARENA_ZONES.forEach(zone => {
      const v = vids[zone.id];
      if (!v) return;
      if (v._isImage) { if (!v.complete || !v.naturalWidth) return; }
      else { if (v.readyState < 2) return; }

      // Convert fractional corners to canvas coords
      const pts = zone.pts.map(([fx,fy]) => [dx + fx*dw, dy + fy*dh]);

      // Expand 2% outward from quad centre so the painted strip never peeks out
      const cx = pts.reduce((s,p)=>s+p[0],0)/4;
      const cy = pts.reduce((s,p)=>s+p[1],0)/4;
      const [TL,TR,BR,BL] = pts.map(([px,py]) => [cx+(px-cx)*1.02, cy+(py-cy)*1.02]);

      // The quads are perspective trapezoids, not parallelograms, so a single
      // affine transform can't hit all 4 corners (BR ends up off the strip).
      // Draw in vertical slices, interpolating top and bottom edges — this
      // pins all 4 corners exactly.
      const N = Math.max(8, Math.round(zone.w / 96));
      const lerp = (P,Q,t) => [P[0]+(Q[0]-P[0])*t, P[1]+(Q[1]-P[1])*t];
      ctx.save();
      for (let i = 0; i < N; i++) {
        const t0=i/N, t1=(i+1)/N;
        const T0=lerp(TL,TR,t0), T1=lerp(TL,TR,t1);
        const B0=lerp(BL,BR,t0);
        const sx = t0*zone.w, sw = (t1-t0)*zone.w;
        const a=(T1[0]-T0[0])/sw, b=(T1[1]-T0[1])/sw;
        const c=(B0[0]-T0[0])/64, d=(B0[1]-T0[1])/64;
        ctx.setTransform(a, b, c, d, T0[0], T0[1]);
        // +1px source overlap on all but the last slice to avoid seams
        const ov = i < N-1 ? 1 : 0;
        ctx.drawImage(v, sx, 0, sw+ov, 64, 0, 0, sw+ov, 64);
      }
      ctx.restore();
    });
  } else {
    ctx.fillStyle = '#111';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#333';
    ctx.font = '14px Outfit, sans-serif';
    ctx.fillText('Loading arena image...', 20, 50);
  }
}

function ensureArenaImage(){
  if (arenaImg) return;
  arenaImg = new Image();
  arenaImg.src = '/api/layout-image';
}

function arenaLoop() {
  if (mode==='arena') drawArenaView();
  requestAnimationFrame(arenaLoop);
}

async function init(){
  buildVideos(); buildStage(); loop();
  await Promise.all(DISPLAYS.map(d=>new Promise(res=>{
    const v=vids[d.id]; if(!v){res();return;}
    if(v._isImage){
      if(v.complete&&v.naturalWidth){res();return;}
      v.addEventListener('load',res,{once:true});
      v.addEventListener('error',res,{once:true});
    } else {
      if(v.readyState>=3){res();return;}
      v.addEventListener('canplaythrough',res,{once:true});
      v.addEventListener('error',res,{once:true});
    }
    setTimeout(res,5000);
  })));
  await Promise.all(DISPLAYS.map(d=>{
    const v=vids[d.id];
    if(!v||v._isImage) return Promise.resolve();
    return v.play().catch(()=>{});
  }));
  setMode(DISPLAYS.length ? 'arena' : 'merged');
  const ld=document.getElementById('loading');
  ld.classList.add('fade');
  setTimeout(()=>ld.style.display='none',600);
}
init();
arenaLoop();
</script>
</body>
</html>
